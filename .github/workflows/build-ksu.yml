name: Build Kernel - Xiaomi 13 Ultra (SM8550)

on:
  workflow_dispatch:
    inputs:
      kernelsu:
        description: 'Enable KernelSU Next'
        required: true
        default: 'true'
        type: boolean
      susfs:
        description: 'Enable SuSFS'
        required: true
        default: 'true'
        type: boolean

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git curl wget zip unzip \
            python3 python3-pip \
            make bc bison flex \
            libssl-dev libelf-dev \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            cpio kmod

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: vauxite
          fetch-depth: 1

      - name: Setup Clang toolchain
        run: |
          mkdir -p $HOME/clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250101-release/Clang-20.0.0git-20250101.tar.gz \
            -O clang.tar.gz
          tar -xf clang.tar.gz -C $HOME/clang
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Setup KernelSU Next
        if: ${{ inputs.kernelsu == 'true' }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo "KSU setup done. Checking version:"
          cat KernelSU/VERSION 2>/dev/null || echo "VERSION file not found"
          echo "Checking KSU directory:"
          ls KernelSU/ || echo "KernelSU directory missing - SETUP FAILED"

      - name: Setup SuSFS
        if: ${{ inputs.susfs == 'true' && inputs.kernelsu == 'true' }}
        run: |
          git clone --depth=1 https://github.com/simonpunk/susfs4ksu ../susfs4ksu

          echo "=== Patch files in repo ==="
          ls ../susfs4ksu/kernel_patches/

          echo "=== Copying susfs.c and susfs.h ==="
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/

          echo "=== Applying patch for fs/ (5.15) ==="
          PATCH_FILE="../susfs4ksu/kernel_patches/50_add_susfs_in_fs-5.15.patch"

          if [ ! -f "$PATCH_FILE" ]; then
            echo "ERROR: File $PATCH_FILE not found!"
            echo "Available patches:"
            ls ../susfs4ksu/kernel_patches/*.patch 2>/dev/null || echo "No .patch files found"
            exit 1
          fi

          if patch -p1 --dry-run < "$PATCH_FILE"; then
            echo "Dry-run OK — applying patch"
            patch -p1 < "$PATCH_FILE"
            echo "✅ fs/ patch applied successfully"
          else
            echo "ERROR: fs/ patch failed to apply (conflicts)!"
            echo "Details:"
            patch -p1 --dry-run < "$PATCH_FILE" 2>&1 || true
            exit 1
          fi

          echo "=== Checking if KSU Next already contains SuSFS hooks ==="
          if grep -r "susfs" KernelSU/ --include="*.c" --include="*.h" -l 2>/dev/null | grep -q .; then
            echo "✅ KSU Next already contains SuSFS hooks — patch 10_ is not needed"
          else
            echo "SuSFS hooks not found in KSU Next — attempting to apply patch"
            KSU_PATCH="../susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch"
            if [ -f "$KSU_PATCH" ]; then
              if patch -p1 --dry-run < "$KSU_PATCH"; then
                patch -p1 < "$KSU_PATCH"
                echo "✅ KSU patch applied"
              else
                echo "⚠️ KSU patch failed to apply — possibly incompatible with KSU Next"
                echo "Build will continue, but SuSFS may not work fully"
                echo "Check the logs for this step manually!"
              fi
            else
              echo "⚠️ KSU patch file not found — skipping"
            fi
          fi

      - name: Generate defconfig
        run: |
          export ARCH=arm64
          make O=out ARCH=arm64 CC=clang \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            gki_defconfig

      - name: Apply KSU + SuSFS config options
        run: |
          if [ "${{ inputs.kernelsu }}" == "true" ]; then
            echo "CONFIG_KSU=y" >> out/.config
          fi
          if [ "${{ inputs.susfs }}" == "true" ]; then
            if grep -r "KSU_SUSFS" KernelSU/ --include="Kconfig" -l 2>/dev/null | grep -q .; then
              echo "CONFIG_KSU_SUSFS=y"             >> out/.config
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"    >> out/.config
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"   >> out/.config
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"   >> out/.config
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"  >> out/.config
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> out/.config
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"  >> out/.config
              echo "✅ SuSFS config added"
            else
              echo "⚠️ Kconfig for SuSFS not found in KernelSU — skipping SuSFS config"
              echo "Kernel will be built without SuSFS!"
            fi
          fi
          make O=out ARCH=arm64 CC=clang LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

      - name: Build kernel
        run: |
          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j$(nproc --all) 2>&1 | tee build.log

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "CRITICAL ERROR: Image not found after build!"
            echo "=== Last 80 lines of log ==="
            tail -80 build.log
            exit 1
          fi
          echo "✅ Build successful!"
          ls -lh out/arch/arm64/boot/Image

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          find out/arch/arm64/boot/dts -name "*.dtb" \
            -exec cp {} AnyKernel3/ \; 2>/dev/null || true
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          zip -r9 ../kernel-sm8550-KSU-$(date +%Y%m%d-%H%M).zip * -x .git\*

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sm8550-${{ github.run_number }}
          path: |
            kernel-sm8550-*.zip
            out/arch/arm64/boot/Image
            build.log
          retention-days: 7
