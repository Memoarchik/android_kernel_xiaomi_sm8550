name: Build Kernel - Xiaomi 13 Ultra (SM8550)

on:
  workflow_dispatch:
    inputs:
      kernelsu:
        description: 'Enable KernelSU Next'
        required: true
        default: 'true'
        type: boolean
      susfs:
        description: 'Enable SuSFS'
        required: true
        default: 'true'
        type: boolean

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git curl wget zip unzip \
            python3 python3-pip \
            make bc bison flex \
            libssl-dev libelf-dev \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            cpio kmod

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: vauxite
          fetch-depth: 1

      - name: Setup Clang toolchain
        run: |
          mkdir -p $HOME/clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250101-release/Clang-20.0.0git-20250101.tar.gz \
            -O clang.tar.gz
          tar -xf clang.tar.gz -C $HOME/clang
          echo "$HOME/clang/bin" >> $GITHUB_PATH
          echo "CLANG_PATH=$HOME/clang" >> $GITHUB_ENV

      - name: Setup KernelSU Next
        if: ${{ inputs.kernelsu == 'true' }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo "KSU_VERSION=$(cat KernelSU/VERSION 2>/dev/null || echo 'unknown')" >> $GITHUB_ENV

      - name: Setup SuSFS
        if: ${{ inputs.susfs == 'true' && inputs.kernelsu == 'true' }}
        run: |
          git clone --depth=1 https://github.com/simonpunk/susfs4ksu ../susfs4ksu
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cd ..
          patch -p1 --no-backup-if-mismatch -d android_kernel_xiaomi_sm8550 \
            < susfs4ksu/kernel_patches/50_add_susfs_in_fs-5.15.patch || true
          patch -p1 --no-backup-if-mismatch -d android_kernel_xiaomi_sm8550 \
            < susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch || true
          cd android_kernel_xiaomi_sm8550

      - name: Generate defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          make O=out ARCH=arm64 CC=clang \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            gki_defconfig

      - name: Apply KSU + SuSFS config options
        run: |
          if [ "${{ inputs.kernelsu }}" == "true" ]; then
            echo "CONFIG_KSU=y" >> out/.config
          fi
          if [ "${{ inputs.susfs }}" == "true" ]; then
            echo "CONFIG_KSU_SUSFS=y"                   >> out/.config
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"          >> out/.config
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"         >> out/.config
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"         >> out/.config
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"        >> out/.config
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"       >> out/.config
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"        >> out/.config
          fi
          make O=out ARCH=arm64 CC=clang LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j$(nproc --all) 2>&1 | tee build.log

      - name: Check output
        run: |
          ls -lh out/arch/arm64/boot/Image || (echo "BUILD FAILED" && cat build.log | tail -50 && exit 1)

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} AnyKernel3/ \; 2>/dev/null || true
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          zip -r9 ../kernel-sm8550-KSU-$(date +%Y%m%d-%H%M).zip * -x .git\*
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sm8550-${{ github.run_number }}
          path: |
            kernel-sm8550-*.zip
            out/arch/arm64/boot/Image
            build.log
          retention-days: 7
