name: Build Kernel - Xiaomi 13 Ultra (SM8550)

on:
  workflow_dispatch:
    inputs:
      kernelsu:
        description: 'Enable KernelSU Next'
        required: true
        default: 'true'
        type: boolean
      susfs:
        description: 'Enable SuSFS'
        required: true
        default: 'true'
        type: boolean

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ────────────────────────────────────────────────────────────────
      # 1. DISK SPACE + SWAP
      # ────────────────────────────────────────────────────────────────
      - name: Free disk space and add swap
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost
          [ -n "${AGENT_TOOLSDIRECTORY}" ] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}" || true
          sudo apt-get clean
          df -h

          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile || \
            sudo dd if=/dev/zero of=/swapfile bs=1M count=12288 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "vm.swappiness=10" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p
          free -h

      # ────────────────────────────────────────────────────────────────
      # 2. DEPENDENCIES
      # ────────────────────────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git curl wget zip unzip \
            python3 python3-pip \
            make bc bison flex \
            libssl-dev libelf-dev \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            cpio kmod dwarves

      # ────────────────────────────────────────────────────────────────
      # 3. CHECKOUT
      # fetch-depth: 0 is REQUIRED.
      # KernelSU-Next versions itself via `git rev-list --count HEAD`
      # on the kernel repo. fetch-depth: 1 returns 1 → manager shows
      # "not installed" even when CONFIG_KSU=y.
      # ────────────────────────────────────────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: vauxite
          fetch-depth: 0

      # ────────────────────────────────────────────────────────────────
      # 4. CLANG 20 TOOLCHAIN
      # ────────────────────────────────────────────────────────────────
      - name: Setup Clang 20 toolchain
        run: |
          mkdir -p "$HOME/clang"
          wget -q \
            https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250101-release/Clang-20.0.0git-20250101.tar.gz \
            -O /tmp/clang.tar.gz
          tar -xf /tmp/clang.tar.gz -C "$HOME/clang"
          rm -f /tmp/clang.tar.gz
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version

      # ────────────────────────────────────────────────────────────────
      # 5. KERNELSU-NEXT — manual integration (no setup.sh)
      #
      # setup.sh has a shell operator precedence bug in its idempotency
      # check that silently skips writing to Kconfig/Makefile when any
      # "kernelsu" string exists in those files. We do it ourselves so
      # the result is guaranteed and visible.
      #
      # Symlink is created with an ABSOLUTE path to avoid resolution
      # issues that occur with relative symlinks across working dirs.
      # ────────────────────────────────────────────────────────────────
      - name: Setup KernelSU Next
        if: ${{ inputs.kernelsu == 'true' }}
        run: |
          KERNEL_ROOT="$(pwd)"

          # Clone KernelSU-Next (full history for accurate versioning)
          git clone https://github.com/KernelSU-Next/KernelSU-Next \
            --branch next \
            --depth 500 \
            KernelSU-Next
          echo "KSU commits: $(git -C KernelSU-Next rev-list --count HEAD)"

          # ── Symlink (absolute path — no relative path ambiguity) ────
          ln -sf "${KERNEL_ROOT}/KernelSU-Next/kernel" drivers/kernelsu

          # Verify symlink points to a real directory with a Kconfig
          test -L drivers/kernelsu          || { echo "ERROR: symlink not created";          exit 1; }
          test -d drivers/kernelsu          || { echo "ERROR: symlink target not a dir";      exit 1; }
          test -f drivers/kernelsu/Kconfig  || { echo "ERROR: KernelSU Kconfig not found";    exit 1; }
          echo "OK: drivers/kernelsu -> $(readlink drivers/kernelsu)"

          # ── Wire into drivers/Kconfig ───────────────────────────────
          # Use Python: sed /pattern/i is unreliable with special chars,
          # multi-endmenu files, and CRLF. Python rfind is unambiguous.
          python3 - <<'PYEOF'
          import sys, os
          path = "drivers/Kconfig"
          content = open(path).read()
          entry = '\nsource "drivers/kernelsu/Kconfig"\n'
          if 'drivers/kernelsu/Kconfig' in content:
              print("OK: drivers/Kconfig already has KSU entry")
          else:
              idx = content.rfind("endmenu")
              if idx == -1:
                  print("ERROR: 'endmenu' not found in drivers/Kconfig", file=sys.stderr)
                  sys.exit(1)
              content = content[:idx] + entry + content[idx:]
              open(path, "w").write(content)
              print("OK: injected KSU source into drivers/Kconfig")
          PYEOF

          # ── Wire into drivers/Makefile ──────────────────────────────
          if grep -q 'obj-.*kernelsu' drivers/Makefile; then
            echo "OK: drivers/Makefile already has KSU obj line"
          else
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
            echo "OK: injected KSU obj into drivers/Makefile"
          fi

          # ── Final verification ──────────────────────────────────────
          echo "--- drivers/Kconfig (last 8 lines) ---"
          tail -8 drivers/Kconfig
          echo "--- drivers/Makefile (last 5 lines) ---"
          tail -5 drivers/Makefile

          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig \
            || { echo "ERROR: Kconfig injection failed"; exit 1; }
          grep -q 'kernelsu' drivers/Makefile \
            || { echo "ERROR: Makefile injection failed"; exit 1; }
          echo "ALL CHECKS PASSED"

      # ────────────────────────────────────────────────────────────────
      # 6. SUSFS — kernel-level patch (required, not just a KSU module)
      # susfs4ksu has two components:
      #   a) kernel patch  (this step)  — compiled into the kernel image
      #   b) KSU module    (post-flash) — optional userspace convenience
      # We only handle (a) here.
      # ────────────────────────────────────────────────────────────────
      - name: Setup SuSFS
        if: ${{ inputs.susfs == 'true' && inputs.kernelsu == 'true' }}
        run: |
          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b gki-android13-5.15 \
            ../susfs4ksu

          echo "=== Available patch files ==="
          ls ../susfs4ksu/kernel_patches/

          # Copy SuSFS source files
          cp ../susfs4ksu/kernel_patches/fs/susfs.c            fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          echo "OK: susfs.c + susfs.h copied"

          # Patch 10: hook SuSFS into KernelSU-Next driver
          echo "=== Applying 10_enable_susfs_for_ksu.patch ==="
          cd KernelSU-Next
          patch -p1 --dry-run \
            < ../susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch \
            || { echo "ERROR: patch 10_ dry-run failed"; exit 1; }
          patch -p1 \
            < ../susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch
          echo "OK: patch 10_ applied"
          cd ..

          # Patch 50: hook SuSFS into kernel fs/
          echo "=== Applying 50_add_susfs_in_gki-android13-5.15.patch ==="
          PATCH_FS="../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          [ -f "$PATCH_FS" ] \
            || { echo "ERROR: $PATCH_FS not found"; ls ../susfs4ksu/kernel_patches/; exit 1; }
          patch -p1 --dry-run < "$PATCH_FS" \
            || { echo "ERROR: patch 50_ dry-run failed"; exit 1; }
          patch -p1 < "$PATCH_FS"
          echo "OK: patch 50_ applied"

          grep -q "KSU_SUSFS" KernelSU-Next/kernel/Kconfig \
            && echo "OK: KSU_SUSFS present in KSU Kconfig" \
            || { echo "ERROR: KSU_SUSFS missing from Kconfig"; exit 1; }

      # ────────────────────────────────────────────────────────────────
      # 7. DEFCONFIG
      # Start with gki_defconfig then merge kalama platform fragments.
      # ────────────────────────────────────────────────────────────────
      - name: Generate defconfig
        run: |
          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            gki_defconfig

          merge_fragment() {
            [ -f "$1" ] && \
              scripts/kconfig/merge_config.sh -m -r -O out out/.config "$1" && \
              echo "merged: $1" || echo "skip (not found): $1"
          }

          merge_fragment arch/arm64/configs/kalama_le_gki.fragment
          merge_fragment arch/arm64/configs/vendor/kalama_GKI.config
          for CFG in arch/arm64/configs/vendor/vauxite.config \
                     arch/arm64/configs/vauxite_defconfig; do
            [ -f "$CFG" ] && { merge_fragment "$CFG"; break; }
          done

          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          echo "=== Config snapshot ==="
          grep -E "^CONFIG_(OVERLAY_FS|KPROBES|KALLSYMS|MODULES)=" out/.config || true

      # ────────────────────────────────────────────────────────────────
      # 8. APPEND KSU + SUSFS OPTIONS
      #
      # IMPORTANT — dependency order:
      #   CONFIG_OVERLAY_FS must be set BEFORE CONFIG_KSU.
      #   KernelSU Kconfig: `config KSU … depends on OVERLAY_FS`
      #   If OVERLAY_FS is missing, olddefconfig silently drops KSU.
      #
      # Now that drivers/Kconfig is properly wired (step 5), the
      # Kconfig system knows CONFIG_KSU exists and keeps it.
      # ────────────────────────────────────────────────────────────────
      - name: Append KSU and SuSFS config options
        run: |
          if [ "${{ inputs.kernelsu }}" == "true" ]; then
            cat >> out/.config <<'EOF'
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF
            echo "OK: KSU options written"
          fi

          if [ "${{ inputs.susfs }}" == "true" ]; then
            cat >> out/.config <<'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          EOF
            echo "OK: SuSFS options written"
          fi

          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          echo "=== Final config ==="
          grep -E "^CONFIG_(OVERLAY_FS|KSU|KSU_SUSFS|KPROBES|KALLSYMS)=" out/.config || true

          # Hard abort if CONFIG_KSU is still not set
          if [ "${{ inputs.kernelsu }}" == "true" ]; then
            if ! grep -q "^CONFIG_KSU=y" out/.config; then
              echo ""
              echo "CRITICAL: CONFIG_KSU dropped by olddefconfig"
              echo ""
              echo "--- drivers/kernelsu symlink ---"
              ls -la drivers/kernelsu || echo "(MISSING)"
              echo "--- drivers/kernelsu/Kconfig head ---"
              head -10 drivers/kernelsu/Kconfig || echo "(MISSING)"
              echo "--- drivers/Kconfig (last 10 lines) ---"
              tail -10 drivers/Kconfig
              exit 1
            fi
            echo "CONFIG_KSU=y confirmed"
          fi

      # ────────────────────────────────────────────────────────────────
      # 9. BUILD
      # ────────────────────────────────────────────────────────────────
      - name: Build kernel
        run: |
          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=unused-variable -Wno-error=unused-function" \
            -j$(nproc) 2>&1 | tee build.log

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "CRITICAL: Image not found — build failed"
            tail -200 build.log
            exit 1
          fi

          echo "OK: build successful"
          ls -lh out/arch/arm64/boot/Image
          echo "=== Kernel version string ==="
          strings out/arch/arm64/boot/Image | grep "Linux version" | head -3 || true

      # ────────────────────────────────────────────────────────────────
      # 10. PACKAGE WITH ANYKERNEL3
      # SM8550 = GKI 2.0: ramdisk lives in init_boot, not boot.
      # We only replace the kernel Image in the boot partition.
      # ────────────────────────────────────────────────────────────────
      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/

          find out/arch/arm64/boot/dts -name "*.dtb" \
            -exec cp {} AnyKernel3/ \; 2>/dev/null || true

          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          grep -q "is_slot_device" anykernel.sh \
            || sed -i '/do.devicecheck/a is_slot_device=1;' anykernel.sh

          TAGS=""
          [ "${{ inputs.kernelsu }}" == "true" ] && TAGS="${TAGS}-KSU"
          [ "${{ inputs.susfs }}" == "true" ]    && TAGS="${TAGS}-SUSFS"
          ZIP_NAME="kernel-sm8550${TAGS}-$(date +%Y%m%d-%H%M).zip"

          zip -r9 "../${ZIP_NAME}" . -x '.git*'
          cd ..
          ls -lh "${ZIP_NAME}"

      # ────────────────────────────────────────────────────────────────
      # 11. UPLOAD ARTIFACTS
      # ────────────────────────────────────────────────────────────────
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sm8550-${{ github.run_number }}
          path: |
            kernel-sm8550-*.zip
            out/arch/arm64/boot/Image
            build.log
          retention-days: 7
