name: Build Kernel - Xiaomi 13 Ultra (SM8550)

on:
  workflow_dispatch:
    inputs:
      kernelsu:
        description: 'Enable KernelSU Next'
        required: true
        default: 'true'
        type: boolean
      susfs:
        description: 'Enable SuSFS'
        required: true
        default: 'true'
        type: boolean

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ────────────────────────────────────────────────────────────────
      # 1. DISK SPACE + SWAP
      # ────────────────────────────────────────────────────────────────
      - name: Free disk space and add swap
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost
          [ -n "${AGENT_TOOLSDIRECTORY}" ] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}" || true
          sudo apt-get clean
          df -h

          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile || \
            sudo dd if=/dev/zero of=/swapfile bs=1M count=12288 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "vm.swappiness=10" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p
          free -h

      # ────────────────────────────────────────────────────────────────
      # 2. DEPENDENCIES
      # ────────────────────────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git curl wget zip unzip \
            python3 python3-pip \
            make bc bison flex \
            libssl-dev libelf-dev \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            cpio kmod dwarves

      # ────────────────────────────────────────────────────────────────
      # 3. CHECKOUT
      # fetch-depth: 0 is REQUIRED.
      # KernelSU-Next versions itself via `git rev-list --count HEAD`.
      # fetch-depth: 1 → returns 1 → manager shows "not installed".
      # ────────────────────────────────────────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: vauxite
          fetch-depth: 0

      # ────────────────────────────────────────────────────────────────
      # 4. CLANG 20 TOOLCHAIN
      # ────────────────────────────────────────────────────────────────
      - name: Setup Clang 20 toolchain
        run: |
          mkdir -p "$HOME/clang"
          wget -q \
            https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250101-release/Clang-20.0.0git-20250101.tar.gz \
            -O /tmp/clang.tar.gz
          tar -xf /tmp/clang.tar.gz -C "$HOME/clang"
          rm -f /tmp/clang.tar.gz
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version

      # ────────────────────────────────────────────────────────────────
      # 5. KERNELSU-NEXT
      #
      # WHY CONFIG_KSU GETS DROPPED — root cause analysis:
      #
      # setup.sh wires KSU into drivers/Kconfig and drivers/Makefile
      # but uses `grep -q "kernelsu"` as its idempotency check.
      # If "kernelsu" appears anywhere in those files (e.g. from a
      # previous commit in the repo), grep exits 0 → setup.sh skips
      # the write → the actual source/obj lines are never added.
      #
      # Additionally, KernelSU Kconfig declares:
      #   config KSU
      #     depends on OVERLAY_FS
      # If CONFIG_OVERLAY_FS is not enabled, olddefconfig silently
      # removes CONFIG_KSU as an unmet dependency — even if you wrote
      # it into .config by hand.
      #
      # FIX: after setup.sh, unconditionally clean and re-inject both
      # lines so state is always correct regardless of repo history.
      # ────────────────────────────────────────────────────────────────
      - name: Setup KernelSU Next
        if: ${{ inputs.kernelsu == 'true' }}
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s stable

          echo "=== Verifying KSU symlink ==="
          ls KernelSU-Next/        || { echo "ERROR: KernelSU-Next/ missing";        exit 1; }
          ls KernelSU-Next/kernel/ || { echo "ERROR: KernelSU-Next/kernel/ missing"; exit 1; }
          ls -la drivers/kernelsu  || { echo "ERROR: drivers/kernelsu symlink missing"; exit 1; }

          # ── Unconditionally fix drivers/Kconfig ─────────────────────
          # Remove any stale/partial kernelsu entry, then re-insert
          # correctly before the closing `endmenu`.
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
          sed -i '/^endmenu$/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # ── Unconditionally fix drivers/Makefile ────────────────────
          # Remove any stale kernelsu obj line, then re-append cleanly.
          sed -i '/kernelsu/d' drivers/Makefile
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          echo "=== drivers/Kconfig (last 8 lines) ==="
          tail -8 drivers/Kconfig
          echo "=== drivers/Makefile (last 5 lines) ==="
          tail -5 drivers/Makefile

          # Abort early if injection failed
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig \
            || { echo "ERROR: Kconfig injection failed"; exit 1; }
          grep -q 'kernelsu' drivers/Makefile \
            || { echo "ERROR: Makefile injection failed"; exit 1; }

          echo "=== KSU commit count ==="
          git -C KernelSU-Next rev-list --count HEAD || true
          echo "=== Kernel commit count ==="
          git rev-list --count HEAD

      # ────────────────────────────────────────────────────────────────
      # 6. SUSFS
      # ────────────────────────────────────────────────────────────────
      - name: Setup SuSFS
        if: ${{ inputs.susfs == 'true' && inputs.kernelsu == 'true' }}
        run: |
          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b gki-android13-5.15 \
            ../susfs4ksu

          echo "=== Available patch files ==="
          ls ../susfs4ksu/kernel_patches/

          cp ../susfs4ksu/kernel_patches/fs/susfs.c            fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          echo "OK: susfs.c + susfs.h copied"

          # Patch 1: KSU hooks (apply inside KernelSU-Next/)
          cd KernelSU-Next
          if patch -p1 --dry-run < ../../susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch 2>&1; then
            patch -p1 < ../../susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch
            echo "OK: patch 10_ applied"
          else
            echo "ERROR: patch 10_ rejected"
            exit 1
          fi
          cd ..

          # Patch 2: fs/ hooks (apply from kernel root)
          PATCH_FS="../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          [ -f "$PATCH_FS" ] || { echo "ERROR: $PATCH_FS not found"; ls ../susfs4ksu/kernel_patches/; exit 1; }
          if patch -p1 --dry-run < "$PATCH_FS" 2>&1; then
            patch -p1 < "$PATCH_FS"
            echo "OK: patch 50_ applied"
          else
            echo "ERROR: patch 50_ rejected"
            exit 1
          fi

          grep -q "KSU_SUSFS" KernelSU-Next/kernel/Kconfig \
            && echo "OK: KSU_SUSFS confirmed in Kconfig" \
            || { echo "ERROR: KSU_SUSFS missing from Kconfig"; exit 1; }

      # ────────────────────────────────────────────────────────────────
      # 7. DEFCONFIG
      # SM8550 needs kalama fragments merged on top of gki_defconfig.
      # ────────────────────────────────────────────────────────────────
      - name: Generate defconfig
        run: |
          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            gki_defconfig

          # kalama_le_gki.fragment — SM8550 platform (required)
          KALAMA_FRAG="arch/arm64/configs/kalama_le_gki.fragment"
          if [ -f "$KALAMA_FRAG" ]; then
            echo "Merging: $KALAMA_FRAG"
            scripts/kconfig/merge_config.sh -m -r -O out out/.config "$KALAMA_FRAG"
          else
            echo "WARNING: $KALAMA_FRAG not found"
          fi

          # vendor/kalama_GKI.config (optional)
          VENDOR_KALAMA="arch/arm64/configs/vendor/kalama_GKI.config"
          [ -f "$VENDOR_KALAMA" ] && \
            scripts/kconfig/merge_config.sh -m -r -O out out/.config "$VENDOR_KALAMA" && \
            echo "Merged: $VENDOR_KALAMA"

          # vauxite device config (optional, try both paths)
          for CFG in \
            arch/arm64/configs/vendor/vauxite.config \
            arch/arm64/configs/vauxite_defconfig; do
            if [ -f "$CFG" ]; then
              scripts/kconfig/merge_config.sh -m -r -O out out/.config "$CFG"
              echo "Merged: $CFG"
              break
            fi
          done

          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          echo "=== Config after defconfig ==="
          grep -E "^CONFIG_(OVERLAY_FS|KPROBES|KALLSYMS|MODULES)=" out/.config || true

      # ────────────────────────────────────────────────────────────────
      # 8. APPEND KSU + SUSFS OPTIONS
      #
      # ORDER MATTERS:
      #   1. CONFIG_OVERLAY_FS=y  — KSU `depends on OVERLAY_FS`.
      #                             Without this, olddefconfig removes
      #                             CONFIG_KSU as unmet dependency.
      #   2. CONFIG_KSU=y         — now valid because dep is satisfied.
      #   3. SuSFS options        — depend on CONFIG_KSU.
      # ────────────────────────────────────────────────────────────────
      - name: Append KSU and SuSFS config options
        run: |
          if [ "${{ inputs.kernelsu }}" == "true" ]; then
            {
              # Dependency of CONFIG_KSU — must come first
              echo "CONFIG_OVERLAY_FS=y"

              # KSU core
              echo "CONFIG_KSU=y"

              # Kprobes — used by KSU for syscall hooking
              echo "CONFIG_KPROBES=y"
              echo "CONFIG_HAVE_KPROBES=y"
              echo "CONFIG_KPROBE_EVENTS=y"

              # Kallsyms — used by KSU for symbol resolution
              echo "CONFIG_KALLSYMS=y"
              echo "CONFIG_KALLSYMS_ALL=y"
            } >> out/.config
            echo "OK: OVERLAY_FS + KSU + kprobes + kallsyms appended"
          fi

          if [ "${{ inputs.susfs }}" == "true" ]; then
            {
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            } >> out/.config
            echo "OK: SuSFS options appended"
          fi

          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          echo "=== Final config ==="
          grep -E "^CONFIG_(OVERLAY_FS|KSU|KSU_SUSFS|KPROBES|KALLSYMS)=" out/.config || true

          # Hard abort if CONFIG_KSU is still missing
          if [ "${{ inputs.kernelsu }}" == "true" ]; then
            if ! grep -q "^CONFIG_KSU=y" out/.config; then
              echo ""
              echo "═══════════════════════════════════════════════════════"
              echo "CRITICAL: CONFIG_KSU dropped by olddefconfig!"
              echo ""
              echo "Most likely causes:"
              echo "  1. CONFIG_OVERLAY_FS not set (KSU depends on it)"
              echo "  2. drivers/kernelsu/Kconfig not visible to Kconfig"
              echo ""
              echo "--- OVERLAY_FS state ---"
              grep "OVERLAY_FS" out/.config || echo "(not found)"
              echo "--- drivers/Kconfig tail ---"
              tail -10 drivers/Kconfig
              echo "--- ls drivers/kernelsu ---"
              ls -la drivers/kernelsu || echo "(missing)"
              echo "--- KernelSU Kconfig ---"
              head -20 drivers/kernelsu/Kconfig || echo "(missing)"
              echo "═══════════════════════════════════════════════════════"
              exit 1
            fi
            echo "CONFIG_KSU=y confirmed"
          fi

      # ────────────────────────────────────────────────────────────────
      # 9. BUILD
      # ────────────────────────────────────────────────────────────────
      - name: Build kernel
        run: |
          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=unused-variable -Wno-error=unused-function" \
            -j$(nproc) 2>&1 | tee build.log

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "CRITICAL: Image not found — build failed"
            tail -200 build.log
            exit 1
          fi

          echo "OK: build successful"
          ls -lh out/arch/arm64/boot/Image
          echo "=== Kernel version string ==="
          strings out/arch/arm64/boot/Image | grep "Linux version" | head -3 || true

      # ────────────────────────────────────────────────────────────────
      # 10. PACKAGE WITH ANYKERNEL3
      # SM8550 = GKI 2.0: ramdisk is in init_boot, not boot.
      # AnyKernel3 only replaces the kernel Image in the boot partition.
      # ────────────────────────────────────────────────────────────────
      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/

          find out/arch/arm64/boot/dts -name "*.dtb" \
            -exec cp {} AnyKernel3/ \; 2>/dev/null || true

          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          grep -q "is_slot_device" anykernel.sh \
            || sed -i '/do.devicecheck/a is_slot_device=1;' anykernel.sh

          TAGS=""
          [ "${{ inputs.kernelsu }}" == "true" ] && TAGS="${TAGS}-KSU"
          [ "${{ inputs.susfs }}" == "true" ]    && TAGS="${TAGS}-SUSFS"
          ZIP_NAME="kernel-sm8550${TAGS}-$(date +%Y%m%d-%H%M).zip"

          zip -r9 "../${ZIP_NAME}" . -x '.git*'
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          cd ..
          ls -lh "${ZIP_NAME}"

      # ────────────────────────────────────────────────────────────────
      # 11. UPLOAD ARTIFACTS
      # ────────────────────────────────────────────────────────────────
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sm8550-${{ github.run_number }}
          path: |
            kernel-sm8550-*.zip
            out/arch/arm64/boot/Image
            build.log
          retention-days: 7
