name: Build Kernel - Xiaomi 13 Ultra (SM8550)

on:
  workflow_dispatch:
    inputs:
      kernelsu:
        description: 'Enable KernelSU Next'
        required: true
        default: 'true'
        type: boolean
      susfs:
        description: 'Enable SuSFS'
        required: true
        default: 'true'
        type: boolean

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ────────────────────────────────────────────────────────────────
      # 1. DISK SPACE + SWAP
      # ────────────────────────────────────────────────────────────────
      - name: Free disk space and add swap
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost
          [ -n "${AGENT_TOOLSDIRECTORY}" ] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}" || true
          sudo apt-get clean
          df -h

          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile || \
            sudo dd if=/dev/zero of=/swapfile bs=1M count=12288 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "vm.swappiness=10" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p
          free -h

      # ────────────────────────────────────────────────────────────────
      # 2. DEPENDENCIES
      # ────────────────────────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git curl wget zip unzip \
            python3 python3-pip \
            make bc bison flex \
            libssl-dev libelf-dev \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            cpio kmod dwarves

      # ────────────────────────────────────────────────────────────────
      # 3. CHECKOUT
      # FIX: fetch-depth: 0 is REQUIRED.
      # KernelSU-Next calculates its version number via:
      #   git rev-list --count HEAD
      # With fetch-depth: 1 this returns 1, causing the manager
      # to report "kernel not installed" even when CONFIG_KSU=y.
      # ────────────────────────────────────────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: vauxite
          fetch-depth: 0   # FIX: was 1 — full history required for KSU versioning

      # ────────────────────────────────────────────────────────────────
      # 4. CLANG 20 TOOLCHAIN
      # ────────────────────────────────────────────────────────────────
      - name: Setup Clang 20 toolchain
        run: |
          mkdir -p "$HOME/clang"
          wget -q \
            https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250101-release/Clang-20.0.0git-20250101.tar.gz \
            -O /tmp/clang.tar.gz
          tar -xf /tmp/clang.tar.gz -C "$HOME/clang"
          rm -f /tmp/clang.tar.gz
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          # Verify clang version
          "$HOME/clang/bin/clang" --version

      # ────────────────────────────────────────────────────────────────
      # 5. KERNELSU-NEXT
      # setup.sh is run from the kernel root; it clones KernelSU-Next/
      # and creates the drivers/kernelsu symlink automatically.
      # ────────────────────────────────────────────────────────────────
      - name: Setup KernelSU Next
        if: ${{ inputs.kernelsu == 'true' }}
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s stable

          echo "=== Verifying KSU directory structure ==="
          ls KernelSU-Next/        || { echo "ERROR: KernelSU-Next/ not found";        exit 1; }
          ls KernelSU-Next/kernel/ || { echo "ERROR: KernelSU-Next/kernel/ not found"; exit 1; }
          ls -la drivers/kernelsu  || { echo "ERROR: drivers/kernelsu symlink missing"; exit 1; }

          # Print KSU version for debugging
          echo "=== KSU git commit count ==="
          git -C KernelSU-Next rev-list --count HEAD || true

      # ────────────────────────────────────────────────────────────────
      # 6. SUSFS
      # ────────────────────────────────────────────────────────────────
      - name: Setup SuSFS
        if: ${{ inputs.susfs == 'true' && inputs.kernelsu == 'true' }}
        run: |
          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b gki-android13-5.15 \
            ../susfs4ksu

          echo "=== Available patch files ==="
          ls ../susfs4ksu/kernel_patches/

          cp ../susfs4ksu/kernel_patches/fs/susfs.c            fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          echo "OK: susfs.c and susfs.h copied"

          # Patch 1: KSU hooks (apply inside KernelSU-Next/)
          echo "=== Applying patch 10_ inside KernelSU-Next/ ==="
          cd KernelSU-Next
          if patch -p1 --dry-run < ../../susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch 2>&1; then
            patch -p1 < ../../susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch
            echo "OK: patch 10_ applied"
          else
            echo "ERROR: patch 10_ rejected"
            exit 1
          fi
          cd ..

          # Patch 2: fs/ hooks (apply from kernel root)
          echo "=== Applying patch 50_ at kernel root ==="
          PATCH_FS="../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          if [ ! -f "$PATCH_FS" ]; then
            echo "ERROR: patch file not found: $PATCH_FS"
            ls ../susfs4ksu/kernel_patches/*.patch || true
            exit 1
          fi
          if patch -p1 --dry-run < "$PATCH_FS" 2>&1; then
            patch -p1 < "$PATCH_FS"
            echo "OK: patch 50_ applied"
          else
            echo "ERROR: patch 50_ rejected"
            exit 1
          fi

          echo "=== Verifying SuSFS entries in Kconfig ==="
          grep -q "KSU_SUSFS" KernelSU-Next/kernel/Kconfig \
            && echo "OK: KSU_SUSFS found in Kconfig" \
            || { echo "ERROR: KSU_SUSFS missing from Kconfig"; cat KernelSU-Next/kernel/Kconfig; exit 1; }

      # ────────────────────────────────────────────────────────────────
      # 7. DEFCONFIG
      # FIX: SM8550 (kalama) requires merging vendor fragments on top
      # of gki_defconfig. Without kalama fragments, critical options
      # like CONFIG_KPROBES may be missing, breaking KSU hooks entirely.
      #
      # Fragment priority (each one overrides the previous):
      #   gki_defconfig
      #     → kalama_le_gki.fragment   (kalama platform base)
      #     → vendor/kalama_GKI.config (if present — Xiaomi-specific)
      #     → vendor/vauxite.config    (if present — device-specific)
      # ────────────────────────────────────────────────────────────────
      - name: Generate defconfig
        run: |
          # Step 1: base GKI config
          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            gki_defconfig

          # Step 2: merge kalama platform fragment
          # kalama_le_gki.fragment covers SM8550 (Kalama) — this is required
          KALAMA_FRAG="arch/arm64/configs/kalama_le_gki.fragment"
          if [ -f "$KALAMA_FRAG" ]; then
            echo "=== Merging $KALAMA_FRAG ==="
            scripts/kconfig/merge_config.sh -m -r -O out out/.config "$KALAMA_FRAG"
          else
            echo "WARNING: $KALAMA_FRAG not found, skipping"
          fi

          # Step 3: merge vendor/kalama GKI config if present
          VENDOR_KALAMA="arch/arm64/configs/vendor/kalama_GKI.config"
          if [ -f "$VENDOR_KALAMA" ]; then
            echo "=== Merging $VENDOR_KALAMA ==="
            scripts/kconfig/merge_config.sh -m -r -O out out/.config "$VENDOR_KALAMA"
          else
            echo "INFO: $VENDOR_KALAMA not found, skipping"
          fi

          # Step 4: merge device-specific vauxite config if present
          for VAUXITE_CFG in \
            arch/arm64/configs/vendor/vauxite.config \
            arch/arm64/configs/vauxite_defconfig; do
            if [ -f "$VAUXITE_CFG" ]; then
              echo "=== Merging $VAUXITE_CFG ==="
              scripts/kconfig/merge_config.sh -m -r -O out out/.config "$VAUXITE_CFG"
              break
            fi
          done

          # Step 5: resolve all symbols
          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          echo "=== Final config summary ==="
          grep -E "^CONFIG_(KSU|KPROBES|KALLSYMS|MODULES|OVERLAYFS)=" out/.config || true

      # ────────────────────────────────────────────────────────────────
      # 8. APPEND KSU + SUSFS CONFIG OPTIONS
      # These are appended AFTER the defconfig is generated so they
      # always take priority over any defaults in the fragments.
      # ────────────────────────────────────────────────────────────────
      - name: Append KSU and SuSFS config options
        run: |
          if [ "${{ inputs.kernelsu }}" == "true" ]; then
            # Core KSU option
            echo "CONFIG_KSU=y" >> out/.config

            # Kprobes must be enabled — KSU uses it for syscall hooks
            echo "CONFIG_KPROBES=y"              >> out/.config
            echo "CONFIG_HAVE_KPROBES=y"         >> out/.config
            echo "CONFIG_KPROBE_EVENTS=y"        >> out/.config

            # Required for symbol resolution
            echo "CONFIG_KALLSYMS=y"             >> out/.config
            echo "CONFIG_KALLSYMS_ALL=y"         >> out/.config

            echo "OK: CONFIG_KSU + kprobes + kallsyms added"
          fi

          if [ "${{ inputs.susfs }}" == "true" ]; then
            {
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            } >> out/.config
            echo "OK: SuSFS config options added"
          fi

          # Re-resolve: olddefconfig will validate all newly appended options
          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          # ── Sanity check: abort early if critical options are missing ──
          FAIL=0
          for OPT in CONFIG_KSU CONFIG_KPROBES CONFIG_KALLSYMS; do
            if ! grep -q "^${OPT}=y" out/.config; then
              echo "CRITICAL: ${OPT} is NOT set after olddefconfig — KSU will not work"
              FAIL=1
            else
              echo "OK: ${OPT}=y confirmed"
            fi
          done
          [ "$FAIL" -eq 0 ] || exit 1

      # ────────────────────────────────────────────────────────────────
      # 9. BUILD
      # ────────────────────────────────────────────────────────────────
      - name: Build kernel
        run: |
          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=unused-variable -Wno-error=unused-function" \
            -j$(nproc) 2>&1 | tee build.log

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "CRITICAL: Image not found — build failed"
            echo "=== Last 200 lines of build.log ==="
            tail -200 build.log
            exit 1
          fi

          echo "OK: build successful"
          ls -lh out/arch/arm64/boot/Image

          # Print kernel version string — this is what KSU manager reads
          echo "=== Kernel version string ==="
          strings out/arch/arm64/boot/Image | grep "Linux version" | head -3 || true

      # ────────────────────────────────────────────────────────────────
      # 10. PACKAGE WITH ANYKERNEL3
      # SM8550 is GKI 2.0 — ramdisk lives in init_boot, not boot.
      # We flash only the kernel Image into boot; AnyKernel3 handles this
      # correctly as long as it doesn't try to repack a ramdisk.
      # ────────────────────────────────────────────────────────────────
      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/

          # Copy DTBs if present (non-fatal if missing)
          find out/arch/arm64/boot/dts -name "*.dtb" \
            -exec cp {} AnyKernel3/ \; 2>/dev/null || true

          cd AnyKernel3
          # Disable device check — allows flashing on any device
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh

          # Configure for SM8550 GKI 2.0: only touch boot partition,
          # do NOT repack ramdisk (init_boot is separate on this device)
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          # Ensure slot-aware flashing
          grep -q "is_slot_device" anykernel.sh \
            || sed -i '/do.devicecheck/a is_slot_device=1;' anykernel.sh

          # Build zip name with KSU/SUSFS tags for clarity
          TAGS=""
          [ "${{ inputs.kernelsu }}" == "true" ] && TAGS="${TAGS}-KSU"
          [ "${{ inputs.susfs }}" == "true" ]    && TAGS="${TAGS}-SUSFS"
          ZIP_NAME="kernel-sm8550${TAGS}-$(date +%Y%m%d-%H%M).zip"

          zip -r9 "../${ZIP_NAME}" . -x '.git*'
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          cd ..
          ls -lh "${ZIP_NAME}"

      # ────────────────────────────────────────────────────────────────
      # 11. UPLOAD ARTIFACTS
      # ────────────────────────────────────────────────────────────────
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sm8550-${{ github.run_number }}
          path: |
            kernel-sm8550-*.zip
            out/arch/arm64/boot/Image
            build.log
          retention-days: 7
