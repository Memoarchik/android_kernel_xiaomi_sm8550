name: Build Kernel - Xiaomi 13 Ultra (SM8550)

on:
  workflow_dispatch:
    inputs:
      kernelsu:
        description: 'Enable KernelSU Next'
        required: true
        default: 'true'
        type: boolean
      susfs:
        description: 'Enable SuSFS'
        required: true
        default: 'true'
        type: boolean

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize build space (free disk + add swap)
        run: |
          # Free up disk space used by unused toolchains
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

          # Add 12GB swap - required for Clang LTO linking (needs ~12-16GB RAM)
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          # Only use swap under real memory pressure
          echo "vm.swappiness=10" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git curl wget zip unzip \
            python3 python3-pip \
            make bc bison flex \
            libssl-dev libelf-dev \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            cpio kmod

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: vauxite
          fetch-depth: 1

      - name: Setup Clang toolchain
        run: |
          mkdir -p $HOME/clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250101-release/Clang-20.0.0git-20250101.tar.gz \
            -O clang.tar.gz
          tar -xf clang.tar.gz -C $HOME/clang
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      # KernelSU-Next official next branch + manual SuSFS patches
      # pershoot/next-susfs targets kernel 6.1 only - not suitable for 5.15
      # rifsxd/next-susfs has a known compile bug on 5.15 (issue #426)
      - name: Setup KernelSU Next
        if: ${{ inputs.kernelsu == 'true' }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s stable
          echo "=== KSU directory structure ==="
          # setup.sh creates KernelSU-Next/ and symlinks drivers/kernelsu -> KernelSU-Next/kernel
          ls KernelSU-Next/ || { echo "ERROR: KernelSU-Next/ not found"; exit 1; }
          ls KernelSU-Next/kernel/ || { echo "ERROR: KernelSU-Next/kernel/ not found"; exit 1; }
          echo "symlink check:"
          ls -la drivers/kernelsu

      - name: Setup SuSFS
        if: ${{ inputs.susfs == 'true' && inputs.kernelsu == 'true' }}
        run: |
          # simonpunk/susfs4ksu gki-android13-5.15 is the correct branch for kernel 5.15 / Android 13
          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b gki-android13-5.15 \
            ../susfs4ksu
          echo "=== Patch files available ==="
          ls ../susfs4ksu/kernel_patches/

          # Copy SuSFS source files into the kernel tree
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          echo "OK: susfs.c and susfs.h copied"

          # Patch 1: apply SuSFS hooks inside KernelSU-Next/ (not kernel root)
          echo "=== Applying patch 10_ inside KernelSU-Next/ ==="
          cd KernelSU-Next
          if patch -p1 --dry-run < ../../susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch; then
            patch -p1 < ../../susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch
            echo "OK: patch 10_ applied inside KernelSU-Next/"
          else
            echo "ERROR: patch 10_ failed inside KernelSU-Next/"
            patch -p1 --dry-run < ../../susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch 2>&1 || true
            exit 1
          fi
          cd ..

          # Patch 2: apply SuSFS hooks into kernel fs/ from kernel root
          echo "=== Applying patch 50_ at kernel root ==="
          PATCH_FS="../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          if [ ! -f "$PATCH_FS" ]; then
            echo "ERROR: $PATCH_FS not found"
            ls ../susfs4ksu/kernel_patches/*.patch || true
            exit 1
          fi
          if patch -p1 --dry-run < "$PATCH_FS"; then
            patch -p1 < "$PATCH_FS"
            echo "OK: patch 50_ applied at kernel root"
          else
            echo "ERROR: patch 50_ failed at kernel root"
            patch -p1 --dry-run < "$PATCH_FS" 2>&1 || true
            exit 1
          fi

          # Verify Kconfig contains SuSFS entries after patch 10_ was applied
          echo "=== Verifying SuSFS in Kconfig ==="
          if grep -q "KSU_SUSFS" KernelSU-Next/kernel/Kconfig; then
            echo "OK: KSU_SUSFS found in KernelSU-Next/kernel/Kconfig"
          else
            echo "ERROR: KSU_SUSFS still not in Kconfig after patch"
            cat KernelSU-Next/kernel/Kconfig
            exit 1
          fi

      - name: Generate defconfig
        run: |
          make O=out ARCH=arm64 CC=clang \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            gki_defconfig

      - name: Apply KSU + SuSFS config options
        run: |
          if [ "${{ inputs.kernelsu }}" == "true" ]; then
            echo "CONFIG_KSU=y" >> out/.config
          fi
          if [ "${{ inputs.susfs }}" == "true" ]; then
            echo "CONFIG_KSU_SUSFS=y"             >> out/.config
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"    >> out/.config
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"   >> out/.config
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"   >> out/.config
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"  >> out/.config
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"  >> out/.config
            echo "OK: SuSFS config options added"
          fi
          make O=out ARCH=arm64 CC=clang LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

      - name: Build kernel
        run: |
          # Use -j$(nproc) instead of --all to avoid overloading swap during LTO
          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=unused-variable" \
            -j$(nproc) 2>&1 | tee build.log
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "CRITICAL: Image not found after build!"
            tail -100 build.log
            exit 1
          fi
          echo "OK: Build successful"
          ls -lh out/arch/arm64/boot/Image

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          find out/arch/arm64/boot/dts -name "*.dtb" \
            -exec cp {} AnyKernel3/ \; 2>/dev/null || true
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          zip -r9 ../kernel-sm8550-KSU-Next-SUSFS-$(date +%Y%m%d-%H%M).zip * -x .git\*

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sm8550-${{ github.run_number }}
          path: |
            kernel-sm8550-*.zip
            out/arch/arm64/boot/Image
            build.log
          retention-days: 7
