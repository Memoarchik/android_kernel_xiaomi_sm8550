name: Build Kernel - Xiaomi 13 Ultra (SM8550)

on:
  workflow_dispatch:
    inputs:
      kernelsu:
        description: 'Enable KernelSU Next'
        required: true
        default: true
        type: boolean
      susfs:
        description: 'Enable SuSFS'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free disk space and add swap
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost
          [ -n "${AGENT_TOOLSDIRECTORY}" ] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}" || true
          sudo apt-get clean
          
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile || \
            sudo dd if=/dev/zero of=/swapfile bs=1M count=12288 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "vm.swappiness=10" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git curl wget zip unzip \
            python3 python3-pip \
            make bc bison flex \
            libssl-dev libelf-dev \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            cpio kmod dwarves

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: vauxite
          fetch-depth: 0

      - name: Setup Clang 20 toolchain
        run: |
          mkdir -p "$HOME/clang"
          wget -q \
            https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250101-release/Clang-20.0.0git-20250101.tar.gz \
            -O /tmp/clang.tar.gz
          tar -xf /tmp/clang.tar.gz -C "$HOME/clang"
          rm -f /tmp/clang.tar.gz
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Setup KernelSU Next
        if: inputs.kernelsu == true
        run: |
          KERNEL_ROOT="$(pwd)"
          # Змінено гілку з 'next' на 'main'
          git clone https://github.com/KernelSU-Next/KernelSU-Next \
            --branch main \
            --depth 500 \
            KernelSU-Next
          
          ln -sf "${KERNEL_ROOT}/KernelSU-Next/kernel" drivers/kernelsu

          python3 - <<'PYEOF'
          import sys
          path = "drivers/Kconfig"
          content = open(path).read()
          entry = '\nsource "drivers/kernelsu/Kconfig"\n'
          if 'drivers/kernelsu/Kconfig' not in content:
              idx = content.rfind("endmenu")
              if idx != -1:
                  content = content[:idx] + entry + content[idx:]
                  open(path, "w").write(content)
          PYEOF

          if ! grep -q 'obj-.*kernelsu' drivers/Makefile; then
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          fi

      - name: Setup SuSFS
        if: inputs.susfs == true && inputs.kernelsu == true
        run: |
          SUSFS_ROOT="$(pwd)/../susfs4ksu"
          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b gki-android13-5.15 \
            "$SUSFS_ROOT"

          cp "$SUSFS_ROOT/kernel_patches/fs/susfs.c" fs/
          cp "$SUSFS_ROOT/kernel_patches/include/linux/susfs.h" include/linux/

          cd KernelSU-Next
          patch -p1 < "$SUSFS_ROOT/kernel_patches/10_enable_susfs_for_ksu.patch"
          cd ..
          patch -p1 < "$SUSFS_ROOT/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"

      - name: Generate base defconfig
        run: |
          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            gki_defconfig

      - name: Append KSU and SuSFS config options
        run: |
          CFG=out/.config
          if [ "${{ inputs.kernelsu }}" = "true" ]; then
            {
              echo "CONFIG_OVERLAY_FS=y"
              echo "CONFIG_KSU=y"
              echo "CONFIG_KSU_WITH_KPROBES=y"
              echo "CONFIG_KPROBES=y"
              echo "CONFIG_HAVE_KPROBES=y"
              echo "CONFIG_KPROBE_EVENTS=y"
              echo "CONFIG_KALLSYMS=y"
              echo "CONFIG_KALLSYMS_ALL=y"
            } >> "$CFG"
          fi

          if [ "${{ inputs.susfs }}" = "true" ]; then
            {
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            } >> "$CFG"
          fi

          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

      - name: Build kernel
        run: |
          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=unused-variable -Wno-error=unused-function" \
            -j$(nproc) 2>&1 | tee build.log

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} AnyKernel3/ \; 2>/dev/null || true
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          
          ZIP_NAME="kernel-sm8550-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../${ZIP_NAME}" . -x '.git*'
          cd ..

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sm8550-${{ github.run_number }}
          path: |
            kernel-sm8550-*.zip
            out/arch/arm64/boot/Image
            build.log
          retention-days: 7
