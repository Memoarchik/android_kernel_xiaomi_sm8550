name: Build Kernel - Xiaomi 13 Ultra (SM8550)

on:
  workflow_dispatch:
    inputs:
      kernelsu:
        description: 'Enable KernelSU Next'
        required: true
        default: 'true'
        type: boolean
      susfs:
        description: 'Enable SuSFS'
        required: true
        default: 'true'
        type: boolean

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git curl wget zip unzip \
            python3 python3-pip \
            make bc bison flex \
            libssl-dev libelf-dev \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            cpio kmod

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: vauxite
          fetch-depth: 1

      - name: Setup Clang toolchain
        run: |
          mkdir -p $HOME/clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250101-release/Clang-20.0.0git-20250101.tar.gz \
            -O clang.tar.gz
          tar -xf clang.tar.gz -C $HOME/clang
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Setup KernelSU Next (next-susfs via pershoot)
        if: ${{ inputs.kernelsu == 'true' }}
        run: |
          # pershoot/KernelSU-Next next-susfs = KSU Next with SuSFS already integrated
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/next-susfs/kernel/setup.sh" \
            | bash -s next-susfs

          # setup.sh clones repo into KernelSU-Next/ and creates:
          # drivers/kernelsu -> symlink to KernelSU-Next/kernel
          # We must search KernelSU-Next/kernel/ directly, NOT via symlink
          echo "=== Directory structure after KSU setup ==="
          ls -la KernelSU-Next/ 2>/dev/null || echo "KernelSU-Next/ not found!"
          ls -la KernelSU-Next/kernel/ 2>/dev/null || echo "KernelSU-Next/kernel/ not found!"
          echo "=== Symlink check ==="
          ls -la drivers/kernelsu 2>/dev/null || echo "drivers/kernelsu symlink not found!"

          # Verify SuSFS is present in next-susfs branch (direct path, no symlink)
          if grep -q "KSU_SUSFS" KernelSU-Next/kernel/Kconfig 2>/dev/null; then
            echo "OK: SuSFS found in KernelSU-Next/kernel/Kconfig"
          else
            echo "ERROR: KSU_SUSFS not found in KernelSU-Next/kernel/Kconfig"
            echo "--- Kconfig content ---"
            cat KernelSU-Next/kernel/Kconfig || echo "File not found"
            exit 1
          fi

      - name: Setup SuSFS
        if: ${{ inputs.susfs == 'true' && inputs.kernelsu == 'true' }}
        run: |
          # Source: GitLab (not GitHub!), branch gki-android13-5.15 for kernel 5.15
          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b gki-android13-5.15 \
            ../susfs4ksu

          echo "=== Available patch files ==="
          ls ../susfs4ksu/kernel_patches/

          # Copy SuSFS source files into kernel tree
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          echo "OK: susfs.c and susfs.h copied"

          # Correct patch filename for Android 13 / kernel 5.15
          PATCH_FS="../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"

          if [ ! -f "$PATCH_FS" ]; then
            echo "ERROR: patch not found: $PATCH_FS"
            echo "Available .patch files:"
            ls ../susfs4ksu/kernel_patches/*.patch 2>/dev/null || echo "none found"
            exit 1
          fi

          echo "=== Dry-run: fs/ patch ==="
          if patch -p1 --dry-run < "$PATCH_FS"; then
            patch -p1 < "$PATCH_FS"
            echo "OK: fs/ patch applied"
          else
            echo "ERROR: fs/ patch has conflicts - see output above"
            exit 1
          fi

          # patch 10_ is NOT needed: pershoot/next-susfs already includes KSU hooks for SuSFS

      - name: Generate defconfig
        run: |
          make O=out ARCH=arm64 CC=clang \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            gki_defconfig

      - name: Apply KSU + SuSFS config options
        run: |
          if [ "${{ inputs.kernelsu }}" == "true" ]; then
            echo "CONFIG_KSU=y" >> out/.config
          fi

          if [ "${{ inputs.susfs }}" == "true" ]; then
            # Direct check - no find/symlink involved
            if grep -q "KSU_SUSFS" KernelSU-Next/kernel/Kconfig 2>/dev/null; then
              echo "OK: SuSFS Kconfig confirmed - adding config options"
              echo "CONFIG_KSU_SUSFS=y"             >> out/.config
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"    >> out/.config
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"   >> out/.config
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"   >> out/.config
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"  >> out/.config
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> out/.config
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"  >> out/.config
            else
              echo "ERROR: SuSFS Kconfig not found in KernelSU-Next/kernel/Kconfig"
              echo "--- Kconfig dump ---"
              cat KernelSU-Next/kernel/Kconfig || echo "File missing"
              exit 1
            fi
          fi

          make O=out ARCH=arm64 CC=clang LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

      - name: Build kernel
        run: |
          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j$(nproc --all) 2>&1 | tee build.log

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "CRITICAL: Image not found after build!"
            tail -80 build.log
            exit 1
          fi
          echo "OK: Build successful"
          ls -lh out/arch/arm64/boot/Image

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          find out/arch/arm64/boot/dts -name "*.dtb" \
            -exec cp {} AnyKernel3/ \; 2>/dev/null || true
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          zip -r9 ../kernel-sm8550-KSU-Next-SUSFS-$(date +%Y%m%d-%H%M).zip * -x .git\*

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sm8550-${{ github.run_number }}
          path: |
            kernel-sm8550-*.zip
            out/arch/arm64/boot/Image
            build.log
          retention-days: 7
